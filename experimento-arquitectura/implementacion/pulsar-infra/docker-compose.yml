# Cluster local de Apache Pulsar — Zookeeper + BookKeeper + Broker como
# SERVICIOS SEPARADOS (no `bin/pulsar standalone`, que empaqueta todo en un
# solo proceso pensado solo para pruebas rápidas y que la rúbrica de la
# Entrega 4 excluye explícitamente — ver
# experimento-arquitectura/contexto/12-plan-entrega-4.md, sección 3).
#
# 1 réplica de cada componente ya cuenta como "cluster real, no monolítico"
# según el plan — cada componente vive en su propio contenedor, con su
# propio ciclo de vida, y se comunican por red igual que en un despliegue
# multi-nodo real (ver helm/values.yaml para el equivalente en GKE con más
# de 1 réplica).
#
# Orden de arranque (encadenado por `depends_on` + healthchecks):
#   zookeeper (sano) -> pulsar-init (one-shot, corre y termina)
#                    -> bookie (necesita metadata ya inicializada)
#                    -> broker (necesita bookie arriba para poder escribir)

networks:
  pulsar:
    driver: bridge

volumes:
  zk-data:
  bk-data:

x-pulsar-image: &pulsar-image apachepulsar/pulsar:3.2.2

services:
  zookeeper:
    image: *pulsar-image
    container_name: hda-pulsar-zookeeper
    restart: on-failure
    networks:
      - pulsar
    volumes:
      - zk-data:/pulsar/data/zookeeper
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - PULSAR_MEM=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
    command: >
      bash -c "bin/apply-config-from-env.py conf/zookeeper.conf &&
               bin/generate-zookeeper-config.sh conf/zookeeper.conf &&
               exec bin/pulsar zookeeper"
    healthcheck:
      test: ["CMD", "bin/pulsar-zookeeper-ruok.sh"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Servicio "one-shot": inicializa la metadata del cluster en Zookeeper
  # (bin/pulsar initialize-cluster-metadata) y termina — es el equivalente
  # a un init container de Kubernetes. bookie y broker esperan a que este
  # contenedor termine con éxito (`service_completed_successfully`) antes
  # de arrancar.
  pulsar-init:
    image: *pulsar-image
    container_name: hda-pulsar-init
    networks:
      - pulsar
    depends_on:
      zookeeper:
        condition: service_healthy
    command: >
      bin/pulsar initialize-cluster-metadata
        --cluster cluster-hda
        --zookeeper zookeeper:2181
        --configuration-store zookeeper:2181
        --web-service-url http://broker:8080
        --broker-service-url pulsar://broker:6650

  bookie:
    image: *pulsar-image
    container_name: hda-pulsar-bookie
    restart: on-failure
    networks:
      - pulsar
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    volumes:
      - bk-data:/pulsar/data/bookkeeper
    environment:
      - clusterName=cluster-hda
      - zkServers=zookeeper:2181
      - metadataServiceUri=metadata-store:zk:zookeeper:2181
      - advertisedAddress=bookie
      - BOOKIE_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    command: >
      bash -c "bin/apply-config-from-env.py conf/bookkeeper.conf &&
               exec bin/pulsar bookie"
    healthcheck:
      test: ["CMD", "bin/bookkeeper", "shell", "bookiesanity"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s

  broker:
    image: *pulsar-image
    container_name: hda-pulsar-broker
    restart: on-failure
    networks:
      - pulsar
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      bookie:
        condition: service_started
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - zookeeperServers=zookeeper:2181
      - clusterName=cluster-hda
      # 1 sola réplica de bookie en el PoC local -> ensemble/quorum en 1.
      # En GKE (helm/values.yaml) esto sube junto con bookkeeper.replicaCount.
      - managedLedgerDefaultEnsembleSize=1
      - managedLedgerDefaultWriteQuorum=1
      - managedLedgerDefaultAckQuorum=1
      - advertisedAddress=broker
      - advertisedListeners=external:pulsar://127.0.0.1:6650
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    ports:
      - "6650:6650" # protocolo binario Pulsar (pulsar-client, productores/consumidores)
      - "8080:8080" # admin REST (pulsar-admin, healthcheck, stats de tópicos)
    command: >
      bash -c "bin/apply-config-from-env.py conf/broker.conf &&
               exec bin/pulsar broker"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
