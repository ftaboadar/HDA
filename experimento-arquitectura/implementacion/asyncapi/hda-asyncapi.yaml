asyncapi: 2.6.0
info:
  title: Hogar de los Alpes — API asíncrona (PoC)
  version: 1.0.0
  description: >
    Contratos de los mensajes que cruzan Bounded Contexts en la PoC. Todos son
    JSON (application/json). La versión del contrato (`version_esquema`) viaja
    como metadata del mensaje (propiedad Pulsar / atributo Pub/Sub), no en el
    cuerpo. Fuente de verdad del código: gestion-de-trabajos/app/infrastructure/
    messaging/publicador_pulsar.py y proveedores/app/common/publicador.py.
servers:
  pulsar-gcp:
    url: pulsar://10.158.0.2:6650
    protocol: pulsar
    description: Apache Pulsar en la VM pulsar-poc-vm (IP privada de la VPC; accesible por Direct VPC egress).
  pubsub-gcp:
    url: pubsub.googleapis.com
    protocol: googlepubsub
    description: Cloud Pub/Sub del proyecto hogaralpes.

channels:
  persistent://hda/gestion-trabajos/trabajos.finalizado:
    description: >
      Evento de INTEGRACIÓN TrabajoFinalizado. Propiedad de ContextoGestionDeTrabajos.
      Nace como evento de dominio dentro del agregado Trabajo y se traduce a
      integración en application/dispatcher_eventos_dominio.py.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarTrabajoFinalizado
      summary: Gestión de Trabajos publica al finalizar un trabajo (POST /trabajos).
      message: { $ref: '#/components/messages/TrabajoFinalizado' }
    subscribe:
      operationId: consumirTrabajoFinalizado
      summary: >
        Suscriptores previstos (suscripción Shared): ContextoReputacion
        ("reputacion-trabajos-finalizado") y ContextoProveedores
        ("proveedores-trabajos-finalizado"). NO desplegados en Cloud Run
        (loop de consumo pull no encaja con Cloud Run sin HTTP).
      message: { $ref: '#/components/messages/TrabajoFinalizado' }

  disp03-poc-verificacion-solicitudes:
    description: Comando/solicitud de verificación de proveedor (cola de trabajo, DISP-03).
    servers: [pubsub-gcp]
    publish:
      operationId: publicarSolicitudVerificacion
      summary: disp03-poc-api publica al aceptar POST /verificaciones (202).
      message: { $ref: '#/components/messages/SolicitudVerificacion' }
    subscribe:
      operationId: consumirSolicitudVerificacion
      summary: >
        Suscripción PUSH disp03-poc-verificacion-solicitudes-push -> POST /pubsub/push
        del worker (OIDC). ack_deadline 30s, retry 1s-20s, dead_letter tras 5 entregas.
      message: { $ref: '#/components/messages/SolicitudVerificacion' }

  disp03-poc-verificacion-fallidas:
    description: DLQ — verificaciones que agotaron reintentos. Suscripción pull para reproceso.
    servers: [pubsub-gcp]
    publish:
      operationId: publicarVerificacionFallida
      message: { $ref: '#/components/messages/VerificacionFallida' }

  disp03-poc-verificacion-eventos-integracion:
    description: >
      Evento de integración ProveedorHabilitado. Topic físicamente separado del de
      solicitudes (bug de producción 2026-09-06: compartirlos hacía llegar el evento
      al handler push como si fuera una solicitud). Sin suscriptores hoy.
    servers: [pubsub-gcp]
    publish:
      operationId: publicarProveedorHabilitado
      message: { $ref: '#/components/messages/ProveedorHabilitado' }


  persistent://hda/gestion-trabajos/novedad.registrada:
    description: Evento NovedadRegistrada.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarNovedadRegistrada
      message: { $ref: '#/components/messages/NovedadRegistrada' }

  persistent://hda/siniestros/decision.partner:
    description: Evento DecisionPartner.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarDecisionPartner
      message: { $ref: '#/components/messages/DecisionPartner' }

  persistent://hda/gestion-trabajos/novedad.resuelta:
    description: Evento NovedadResuelta.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarNovedadResuelta
      message: { $ref: '#/components/messages/NovedadResuelta' }

  persistent://hda/proveedores/agenda.liberada:
    description: Evento AgendaLiberada.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarAgendaLiberada
      message: { $ref: '#/components/messages/AgendaLiberada' }

  persistent://hda/reputacion/reputacion.publicada:
    description: Evento ReputacionPublicada.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarReputacionPublicada
      message: { $ref: '#/components/messages/ReputacionPublicada' }

  persistent://hda/scoring/scoring.actualizado:
    description: Evento ScoringActualizado.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarScoringActualizado
      message: { $ref: '#/components/messages/ScoringActualizado' }

  persistent://hda/proveedores/comandos:
    description: Comandos hacia Proveedores.
    servers: [pulsar-gcp]
    publish:
      operationId: enviarComandoProveedores
      message: { $ref: '#/components/messages/ComandoProveedores' }

  persistent://hda/pagos/comandos:
    description: Comandos hacia Pagos.
    servers: [pulsar-gcp]
    publish:
      operationId: enviarComandoPagos
      message: { $ref: '#/components/messages/ComandoPagos' }

  persistent://hda/siniestros/comandos:
    description: Comandos hacia Siniestros.
    servers: [pulsar-gcp]
    publish:
      operationId: enviarComandoSiniestros
      message: { $ref: '#/components/messages/ComandoSiniestros' }

  persistent://hda/pagos/pago.retenido:
    description: Evento PagoRetenido.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarPagoRetenido
      message: { $ref: '#/components/messages/PagoRetenido' }

  persistent://hda/pagos/pago.retencion-fallida:
    description: Evento PagoRetencionFallida.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarPagoRetencionFallida
      message: { $ref: '#/components/messages/PagoRetencionFallida' }

  persistent://hda/pagos/pago.liberado:
    description: Evento PagoLiberado.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarPagoLiberado
      message: { $ref: '#/components/messages/PagoLiberado' }

  persistent://hda/pagos/pago.fallido:
    description: Evento PagoFallido.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarPagoFallido
      message: { $ref: '#/components/messages/PagoFallido' }

  persistent://hda/pagos/pago.compensado:
    description: Evento PagoCompensado.
    servers: [pulsar-gcp]
    publish:
      operationId: publicarPagoCompensado
      message: { $ref: '#/components/messages/PagoCompensado' }

components:
  messages:

    NovedadRegistrada:
      name: NovedadRegistrada
      contentType: application/json
      payload: { $ref: '#/components/schemas/NovedadRegistrada' }
    DecisionPartner:
      name: DecisionPartner
      contentType: application/json
      payload: { $ref: '#/components/schemas/DecisionPartner' }
    NovedadResuelta:
      name: NovedadResuelta
      contentType: application/json
      payload: { $ref: '#/components/schemas/NovedadResuelta' }
    AgendaLiberada:
      name: AgendaLiberada
      contentType: application/json
      payload: { $ref: '#/components/schemas/AgendaLiberada' }
    ReputacionPublicada:
      name: ReputacionPublicada
      contentType: application/json
      payload: { $ref: '#/components/schemas/ReputacionPublicada' }
    ScoringActualizado:
      name: ScoringActualizado
      contentType: application/json
      payload: { $ref: '#/components/schemas/ScoringActualizado' }
    ComandoProveedores:
      name: ComandoProveedores
      contentType: application/json
      payload: { $ref: '#/components/schemas/ComandoProveedores' }
    ComandoPagos:
      name: ComandoPagos
      contentType: application/json
      payload: { $ref: '#/components/schemas/ComandoPagos' }
    ComandoSiniestros:
      name: ComandoSiniestros
      contentType: application/json
      payload: { $ref: '#/components/schemas/ComandoSiniestros' }
    PagoRetenido:
      name: PagoRetenido
      contentType: application/json
      payload: { $ref: '#/components/schemas/PagoRetenido' }
    PagoRetencionFallida:
      name: PagoRetencionFallida
      contentType: application/json
      payload: { $ref: '#/components/schemas/PagoRetencionFallida' }
    PagoLiberado:
      name: PagoLiberado
      contentType: application/json
      payload: { $ref: '#/components/schemas/PagoLiberado' }
    PagoFallido:
      name: PagoFallido
      contentType: application/json
      payload: { $ref: '#/components/schemas/PagoFallido' }
    PagoCompensado:
      name: PagoCompensado
      contentType: application/json
      payload: { $ref: '#/components/schemas/PagoCompensado' }

    TrabajoFinalizado:
      name: TrabajoFinalizado
      contentType: application/json
      headers:
        type: object
        properties:
          tipo_evento: { type: string, const: TrabajoFinalizado }
          version_esquema: { type: string, example: "1" }
          content_type: { type: string, const: application/json }
          productor: { type: string, example: gestion-de-trabajos }
      payload: { $ref: '#/components/schemas/TrabajoFinalizado' }
    SolicitudVerificacion:
      name: SolicitudVerificacion
      contentType: application/json
      headers: { $ref: '#/components/schemas/AtributosPubSub' }
      payload: { $ref: '#/components/schemas/SolicitudVerificacion' }
    VerificacionFallida:
      name: VerificacionFallida
      contentType: application/json
      headers: { $ref: '#/components/schemas/AtributosPubSub' }
      payload: { $ref: '#/components/schemas/VerificacionFallida' }
    ProveedorHabilitado:
      name: ProveedorHabilitado
      contentType: application/json
      headers: { $ref: '#/components/schemas/AtributosPubSub' }
      payload: { $ref: '#/components/schemas/ProveedorHabilitado' }

  schemas:
    AtributosPubSub:
      type: object
      properties:
        tipo_evento: { type: string }
        version_esquema: { type: string, example: "1" }
        content_type: { type: string, const: application/json }
        productor: { type: string, example: disp03-poc-api }
    TrabajoFinalizado:
      type: object
      required: [trabajo_id, proveedor_id, monto, moneda, region, ocurrido_en]
      properties:
        trabajo_id: { type: string, format: uuid }
        proveedor_id: { type: string }
        monto: { type: string, description: "Decimal como string (no float) para no perder precisión.", example: "200.00" }
        moneda: { type: string, example: COP }
        region: { type: string, enum: [CO, BR] }
        ocurrido_en: { type: string, format: date-time }
    SolicitudVerificacion:
      type: object
      required: [verificacion_id, proveedor_id, tipo_verificador]
      properties:
        verificacion_id: { type: string, format: uuid }
        proveedor_id: { type: string }
        tipo_verificador: { type: string, enum: [policia, rues, certificadora] }
        solicitado_en: { type: string, format: date-time }
    VerificacionFallida:
      type: object
      required: [verificacion_id, proveedor_id, motivo_falla]
      properties:
        verificacion_id: { type: string, format: uuid }
        proveedor_id: { type: string }
        motivo_falla: { type: string }
    ProveedorHabilitado:
      type: object
      required: [proveedor_id, evento, routing_key]
      properties:
        proveedor_id: { type: string }
        evento: { type: string, const: ProveedorHabilitado }
        routing_key: { type: string, const: proveedor.habilitado }


    NovedadRegistrada:
      type: object
    DecisionPartner:
      type: object
    NovedadResuelta:
      type: object
    AgendaLiberada:
      type: object
    ReputacionPublicada:
      type: object
    ScoringActualizado:
      type: object
    ComandoProveedores:
      type: object
    ComandoPagos:
      type: object
    ComandoSiniestros:
      type: object
    PagoRetenido:
      type: object
    PagoRetencionFallida:
      type: object
    PagoLiberado:
      type: object
    PagoFallido:
      type: object
    PagoCompensado:
      type: object
