services:
  # Pulsar STANDALONE (un solo contenedor: broker + bookie + zookeeper
  # embebidos en la misma JVM) — deliberadamente distinto del cluster de
  # 3 servicios de pulsar-infra/docker-compose.yml (zookeeper+bookie+broker
  # separados), que es el que cuenta para la rúbrica como "cluster real".
  # Este servicio existe SOLO para que el CI de este microservicio pueda
  # correr los CP-1..7 de DISP-03 contra Pulsar real sin levantar los 3
  # contenedores completos por cada corrida de PR. No reemplaza al cluster
  # real para ningún otro propósito (despliegue, demo, otros experimentos).
  pulsar:
    image: apachepulsar/pulsar:3.2.2
    command: bin/pulsar standalone --no-functions-worker
    environment:
      # Memoria acotada para correr cómodo en un runner de GitHub Actions
      # (mismo patrón que pulsar-infra/docker-compose.yml, ajustado un poco
      # al alza porque standalone combina broker+bookie+zk en un solo JVM).
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
    # Sin publicar puertos al host: api/worker/pulsar-init lo alcanzan por
    # DNS interno de compose (`pulsar:6650`/`pulsar:8080`), nada fuera del
    # stack necesita tocarlo. Publicar 6650/8080 chocaría en dev local con
    # pulsar-infra/docker-compose.yml (el cluster real) si ambos stacks
    # corren a la vez en la misma máquina.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

  # Servicio "one-shot" (equivalente a scripts/pulsar-namespaces-local.sh,
  # pero contra el standalone de este compose en vez del cluster de
  # pulsar-infra): crea el tenant `hda` y el namespace `hda/proveedores`
  # (ver app/common/pulsar_topology.py) antes de que api/worker arranquen.
  # También crea `hda/gestion-trabajos` (vacío, sin nada de ese servicio
  # desplegado aquí): el worker arranca un segundo consumidor pull sobre
  # `persistent://hda/gestion-trabajos/trabajos.finalizado`
  # (app/worker/consumidor_trabajos_finalizado.py) y revienta ese hilo si el
  # namespace no existe (ver el bug corregido en
  # app/common/pulsar_topology.py) — crearlo vacío aquí evita el
  # crash-loop de ese hilo y deja /salud del worker realmente en verde en
  # CI, aunque DISP-03 (CP-1..7) no dependa de ese segundo consumidor.
  # Idempotente (`|| true`), así que reintentar `docker compose up` no falla.
  pulsar-init:
    image: apachepulsar/pulsar:3.2.2
    depends_on:
      pulsar:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        bin/pulsar-admin --admin-url http://pulsar:8080 tenants create hda || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces create hda/proveedores || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces create hda/gestion-trabajos || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces list hda

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hda
      POSTGRES_PASSWORD: hda
      POSTGRES_DB: verificacion
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hda -d verificacion"]
      interval: 5s
      timeout: 5s
      retries: 15

  mock-policia:
    build: .
    command: uvicorn app.mocks.main:app --host 0.0.0.0 --port 8000
    environment:
      MOCK_NAME: policia
    ports:
      - "8101:8000"

  mock-rues:
    build: .
    command: uvicorn app.mocks.main:app --host 0.0.0.0 --port 8000
    environment:
      MOCK_NAME: rues
    ports:
      - "8102:8000"

  mock-certificadora:
    build: .
    command: uvicorn app.mocks.main:app --host 0.0.0.0 --port 8000
    environment:
      MOCK_NAME: certificadora
    ports:
      - "8103:8000"

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    restart: on-failure:5
    environment:
      TRANSPORTE: pulsar
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
      DATABASE_URL: postgresql+psycopg2://hda:hda@postgres:5432/verificacion
      MOCK_POLICIA_URL: http://mock-policia:8000
      MOCK_RUES_URL: http://mock-rues:8000
      MOCK_CERTIFICADORA_URL: http://mock-certificadora:8000
    ports:
      - "8000:8000"
    depends_on:
      pulsar:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker.main
    restart: on-failure:5
    environment:
      TRANSPORTE: pulsar
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
      DATABASE_URL: postgresql+psycopg2://hda:hda@postgres:5432/verificacion
      MOCK_POLICIA_URL: http://mock-policia:8000
      MOCK_RUES_URL: http://mock-rues:8000
      MOCK_CERTIFICADORA_URL: http://mock-certificadora:8000
      MAX_REINTENTOS: "4"
      TIMEOUT_EXTERNO_S: "3.0"
      BACKOFF_BASE_S: "0.5"
      BACKOFF_MAX_S: "8.0"
    depends_on:
      pulsar:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mock-policia:
        condition: service_started
      mock-rues:
        condition: service_started
      mock-certificadora:
        condition: service_started
