name: Validación de PR

# Capa de validación previa al merge — pensada especialmente para código generado
# o asistido por IA: detecta lo que un lector humano rápido puede pasar por alto
# (nombres no definidos, imports sin usar, subprocess sin manejo explícito de
# errores, datetimes naive, sintaxis rota) antes de que llegue a main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Matriz sobre los microservicios propios (Entrega 4: sección 1 de
  # `experimento-arquitectura/contexto/historico/12-plan-entrega-4.md`; Entrega 5: se suma cada
  # servicio nuevo, ver CONVENCIONES-SERVICIO-Y-DESPLIEGUE.md §7). Proveedores
  # (escenario DISP-03, ya certificado — obligatorio, sección 8: propiedad de Johan),
  # Gestión de Trabajos y Reputación (propiedad de Frans y Daniel
  # respectivamente, en ramas hermanas — todavía NO existen en esta rama).
  #
  # Cada entrada se auto-detecta: si `requirements-dev.txt` no existe todavía
  # en la carpeta del microservicio, el resto de los pasos se omite vía
  # `if: steps.existe.outputs.ok == 'true'` (nunca falla por un `cd` a una
  # carpeta inexistente, porque el paso completo ni se ejecuta) y el job
  # termina en verde de forma trivial. Además, `gestion-de-trabajos` y
  # `reputacion` llevan `opcional: true` -> `continue-on-error`, para que el
  # día que ya existan pero su propio `tests/` todavía no esté 100% verde
  # (ej. mientras se integra su PR), esta rama y las hermanas no queden
  # bloqueadas por un servicio que no es el propio. Proveedores se mantiene
  # `opcional: false`: es el único de los tres cuya suite ya está probada y
  # no debe degradarse silenciosamente.
  python-lint-y-pruebas:
    name: Python — lint, formato y suite de pruebas (${{ matrix.check }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.opcional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `check` es lo que aparece en el nombre del job y, por tanto, el nombre del check
          # REQUERIDO por la protección de la rama ("... (DISP-03)"). Está desacoplado de
          # `servicio`/`carpeta` a propósito: renombrar la carpeta no debe cambiar el check.
          # Si algún día se cambia `check`, hay que actualizar también la regla en GitHub
          # (Settings > Branches), o el PR quedará en "Expected — Waiting for status to be reported".
          - servicio: proveedores
            check: DISP-03
            carpeta: experimento-arquitectura/implementacion/proveedores
            opcional: false
            compose_file: docker-compose.yml
          - servicio: gestion-de-trabajos
            check: gestion-de-trabajos
            carpeta: experimento-arquitectura/implementacion/gestion-de-trabajos
            opcional: true
            # docker-compose.yml "normal" no trae el mock del CRM — los tests
            # de integración de DISP-02 (tests/integracion/test_disp02_throttler.py)
            # necesitan el stack completo de docker-compose.disp02.yml (api +
            # postgres + mock-crm), ver ese archivo para el detalle.
            compose_file: docker-compose.disp02.yml
          - servicio: reputacion
            check: reputacion
            carpeta: experimento-arquitectura/implementacion/reputacion
            opcional: true
            compose_file: docker-compose.yml
          # Pagos es microservicio propio desde la entrega parcial y no estaba en la matriz.
          # Lint, formato y unitarias verificados localmente el 2026-09-21; pasar a
          # opcional: false (igual que gestion y reputacion) tras la primera corrida verde en GitHub.
          - servicio: pagos
            check: pagos
            carpeta: experimento-arquitectura/implementacion/pagos
            opcional: true
            compose_file: docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      # Corre siempre en la raíz del repo (sin working-directory), a
      # propósito: si la carpeta del microservicio ni siquiera existe
      # todavía en esta rama, este `test -f` no falla (a diferencia de un
      # `cd` a una ruta inexistente, que sí tumbaría el step).
      - name: Verificar si ${{ matrix.servicio }} ya existe en esta rama
        id: existe
        run: |
          if [ -f "${{ matrix.carpeta }}/requirements-dev.txt" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.servicio }} todavía no tiene requirements-dev.txt en esta rama (opcional=${{ matrix.opcional }}) — se omite el resto de este job."
          fi

      - uses: actions/setup-python@v5
        if: steps.existe.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        if: steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: ruff check .

      - name: Formato (ruff format --check)
        if: steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: ruff format --check .

      - name: Compilación (sintaxis y nombres no definidos)
        if: steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: |
          python -m py_compile $(find app tests cli -name "*.py" 2>/dev/null)

      - name: Levantar el stack local (docker compose)
        if: steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: docker compose -f ${{ matrix.compose_file }} up -d --build

      - name: Esperar a que la API esté sana
        if: steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: |
          PORT=$(docker compose -f ${{ matrix.compose_file }} port api 8000 | head -n 1 | awk -F: '{print $NF}')
          echo "API_URL=http://localhost:$PORT" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            curl -sf http://localhost:$PORT/salud > /dev/null && exit 0
            sleep 2
          done
          echo "La API no quedó sana a tiempo"
          docker compose -f ${{ matrix.compose_file }} logs
          exit 1

      - name: Correr la suite de pruebas
        if: steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: pytest tests/ -v

      - name: Publicar reporte de métricas crudas
        if: always() && steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: python tests/reporte.py || true

      - name: Logs de los servicios (solo si algo falló)
        if: failure() && steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: docker compose -f ${{ matrix.compose_file }} logs

      - name: Apagar el stack
        if: always() && steps.existe.outputs.ok == 'true'
        working-directory: ${{ matrix.carpeta }}
        run: docker compose -f ${{ matrix.compose_file }} down -v

  # Valida TODOS los stacks (antes solo proveedores/infra). Sin credenciales de GCP: el backend GCS
  # se omite con -backend=false. Al crear un stack nuevo, agrégalo a esta lista.
  terraform:
    name: Terraform — formato y validación (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - infra-modules/cloud-run-service
          - proveedores/infra
          - gestion-de-trabajos/infra
          - pagos/infra
          - reputacion/infra
          - mocks-pagos/infra
          - mocks-crm/infra
          - pulsar-infra/gcp
          - observabilidad
          - k6/infra
    defaults:
      run:
        working-directory: experimento-arquitectura/implementacion/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt (verificación, sin escribir)
        run: terraform fmt -check -recursive

      - name: terraform init (sin backend, sin credenciales de GCP)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  # Check agregador con el nombre ORIGINAL del job (antes de la matriz): si `main` lo exige como check
  # obligatorio, sigue existiendo. Pasa solo si los 10 stacks de la matriz pasan.
  terraform-resultado:
    name: Terraform — formato y validación (infra GCP)
    runs-on: ubuntu-latest
    needs: terraform
    if: always()
    steps:
      - name: Todos los stacks de Terraform deben pasar
        run: |
          if [ "${{ needs.terraform.result }}" != "success" ]; then
            echo "Falló la validación de al menos un stack de Terraform: ${{ needs.terraform.result }}"
            exit 1
          fi

  scripts-despliegue:
    name: Scripts de despliegue — sintaxis bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n y shellcheck de implementacion/scripts
        run: |
          cd experimento-arquitectura/implementacion/scripts
          for f in *.sh; do bash -n "$f"; done
          shellcheck -x *.sh

  higiene-general:
    name: Higiene general del repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sin marcadores de conflicto de merge sin resolver
        run: |
          if grep -rIn '^<<<<<<< \|^=======$\|^>>>>>>> ' \
              --include="*.py" --include="*.md" --include="*.tf" --include="*.yml" --include="*.yaml" . ; then
            echo "Se encontraron marcadores de conflicto de merge sin resolver"
            exit 1
          fi

      - name: Sin patrones obvios de secretos filtrados
        run: |
          if grep -rIEn 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----' \
              --include="*.py" --include="*.tf" --include="*.md" --include="*.yml" --include="*.yaml" --include="*.env*" . ; then
            echo "Posible secreto detectado — revisar antes de mergear"
            exit 1
          fi

  oasdiff:
    name: Retrocompatibilidad de Contratos REST (oasdiff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr-branch
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch
      - name: Instalar oasdiff
        run: curl -sSfL https://raw.githubusercontent.com/Tufin/oasdiff/main/install.sh | sh
      - name: Verificar compatibilidad BACKWARD de openapi.json
        run: |
          for file in $(find main-branch/experimento-arquitectura/implementacion -name "openapi.json"); do
            pr_file="pr-branch/${file#main-branch/}"
            if [ -f "$pr_file" ]; then
              echo "Revisando $pr_file contra $file"
              ./bin/oasdiff breaking "$file" "$pr_file" --fail-on ERR || exit 1
            fi
          done
